<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Xiroro Script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    

    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-active { border-bottom: 2px solid #22d3ee; color: #22d3ee; }
        .desc-scroll::-webkit-scrollbar { width: 4px; }
        .desc-scroll::-webkit-scrollbar-track { background: transparent; }
        .desc-scroll::-webkit-scrollbar-thumb { background: #22d3ee; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="areaLogin" class="max-w-md mx-auto mt-20 glass p-8 rounded-2xl shadow-2xl border-t-4 border-t-cyan-500">
        <div class="text-center mb-8">
            <i class="fa-solid fa-user-shield text-5xl text-cyan-400 mb-4"></i>
            <h2 class="text-2xl font-bold">Admin Login</h2>
            <p class="text-slate-400 text-sm mt-2">Masuk untuk mengelola toko Xiroro</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Admin" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-cyan-500">
            <input type="password" id="password" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-cyan-500">
            <button onclick="loginAdmin()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-lg font-bold transition mt-4"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
        </div>
    </div>

    <div id="areaAdmin" class="max-w-6xl mx-auto" style="display: none;">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-cyan-400"><i class="fa-solid fa-gauge-high"></i> Xiroro <span class="text-white">Control</span></h1>
            <button onclick="logoutAdmin()" class="text-red-400 hover:text-red-300 font-medium"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </header>

        <div class="flex gap-8 border-b border-slate-700 mb-8">
            <button onclick="switchTab('produk')" id="btn-produk" class="pb-4 tab-active font-medium">Manajemen Produk</button>
            <button onclick="switchTab('pesanan')" id="btn-pesanan" class="pb-4 text-slate-400 font-medium">Log Pesanan</button>
            <button onclick="switchTab('ulasan')" id="btn-ulasan" class="pb-4 text-slate-400 font-medium">Kelola Ulasan</button>
            <button onclick="switchTab('tampilan')" id="btn-tampilan" class="pb-4 text-slate-400 font-medium">Pengaturan Etalase</button>
        </div>

        <section id="section-produk" class="block">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="glass p-6 rounded-2xl h-fit">
                    <h2 id="form-title" class="text-xl font-bold mb-6 text-cyan-400"><i class="fa-solid fa-plus"></i> Tambah Produk Baru</h2>
                    <form id="form-produk" onsubmit="simpanProduk(event)" class="space-y-4">
                        <input type="hidden" id="edit-id"> <input type="hidden" id="gambarUrlLama"> 
                        <div>
                            <label class="block text-sm mb-1 text-slate-400">Nama Produk</label>
                            <input type="text" id="nama" placeholder="Misal: Script Skin Chou" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg focus:outline-cyan-500" required>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm mb-1 text-slate-400">Harga (Rp)</label>
                                <input type="number" id="harga" placeholder="Angka saja" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg focus:outline-cyan-500" required>
                            </div>
                            <div>
                                <label class="block text-sm mb-1 text-slate-400">YouTube ID (Opsional)</label>
                                <input type="text" id="videoID" placeholder="Contoh: dQw4w9WgXcQ" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg focus:outline-cyan-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1 text-slate-400">Deskripsi Singkat</label>
                            <textarea id="deskripsi" placeholder="Deskripsi mod..." class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg h-20 focus:outline-cyan-500" required></textarea>
                        </div>
                        <div>
                            <label class="block text-sm mb-1 text-slate-400">Link File / Checkout</label>
                            <input type="text" id="fileLink" placeholder="Link download/pembayaran" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg focus:outline-cyan-500" required>
                        </div>
                        <div>
                            <label class="block text-sm mb-1 text-slate-400">Foto Produk</label>
                            <input type="file" id="foto" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-cyan-400 hover:file:bg-slate-600">
                            <p id="info-foto" class="text-xs text-yellow-500 mt-1 hidden">Kosongkan jika tidak ingin mengganti foto lama.</p>
                        </div>
                        
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-lg font-bold transition mt-4"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Etalase</button>
                        <button type="button" id="btn-cancel" onclick="resetForm()" class="w-full text-slate-400 hover:text-white mt-2 hidden">Batal Edit</button>
                    </form>
                </div>

                <div class="lg:col-span-2">
                    <div class="glass p-6 rounded-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold">Etalase Saat Ini</h2>
                            <div class="flex gap-3">
                                <button onclick="publishEtalase()" class="text-emerald-400 hover:text-emerald-300 text-sm"><i class="fa-solid fa-cloud-arrow-up"></i> Publikasi</button>
                                <button onclick="backupProduk()" class="text-amber-400 hover:text-amber-300 text-sm"><i class="fa-solid fa-download"></i> Backup JSON</button>
                                <button onclick="loadProduk()" class="text-cyan-400 hover:text-cyan-300 text-sm"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                            </div>
                        </div>
                        <input type="text" id="cariProduk" oninput="renderProdukAdmin()" placeholder="Cari nama produk..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-cyan-500 mb-4">
                        <div id="list-produk" class="space-y-4 max-h-[600px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #22d3ee #1e293b;">
                            </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="section-pesanan" class="hidden">
            <div class="glass p-8 rounded-2xl border-t-4 border-t-green-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-green-400"><i class="fa-solid fa-clipboard-list"></i> Log Pesanan</h2>
                    <button onclick="loadPesanan()" class="text-green-400 hover:text-green-300 text-sm"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                    <select id="bulanPesanan" onchange="renderPesananAdmin()" class="bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-green-500 text-white cursor-pointer">
                        <option value="">Semua Bulan</option>
                    </select>
                    <input type="text" id="cariPesanan" oninput="renderPesananAdmin()" placeholder="Cari kode / produk / nama DANA..." class="bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-green-500">
                    <div class="flex gap-2">
                        <button onclick="exportPesananPDF()" class="flex-1 bg-red-600/80 hover:bg-red-500 text-white px-4 py-3 rounded-lg font-bold text-sm transition"><i class="fa-solid fa-file-pdf mr-1"></i> PDF</button>
                        <button onclick="exportPesananCSV()" class="flex-1 bg-blue-600/80 hover:bg-blue-500 text-white px-4 py-3 rounded-lg font-bold text-sm transition"><i class="fa-solid fa-file-csv mr-1"></i> CSV</button>
                        <button onclick="hapusBulan()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-4 py-3 rounded-lg font-bold text-sm transition"><i class="fa-solid fa-trash-can mr-1"></i> Hapus Bulan</button>
                    </div>
                </div>
                <div id="list-pesanan" class="space-y-3 max-h-[600px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #22c55e #1e293b;">
                    <p class="text-center text-slate-500">Belum ada pesanan.</p>
                </div>
                <div class="w-full mt-6 glass rounded-xl p-4">
                    <h3 class="text-sm font-bold text-green-400 mb-3"><i class="fa-solid fa-chart-pie mr-1"></i> Pendapatan 6 Bulan Terakhir</h3>
                    <canvas id="chartPesanan" height="80"></canvas>
                </div>
                <div id="statAdmin" class="w-full mt-6"></div>
            </div>
        </section>

        <section id="section-tampilan" class="hidden">
            <div class="glass p-8 rounded-2xl max-w-2xl border-t-4 border-t-purple-500">
                <h2 class="text-xl font-bold mb-6 text-purple-400"><i class="fa-solid fa-wand-magic-sparkles"></i> Pengaturan Website Pembeli</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block mb-2 text-slate-300">URL Video Background (MP4 GitHub/Lokal)</label>
                        <input type="text" id="cfg-video" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-purple-500" placeholder="https://raw.githubusercontent.com/...">
                    </div>
                    <div>
                        <label class="block mb-2 text-slate-300">URL Logo Toko (PNG/JPG)</label>
                        <input type="text" id="cfg-logo" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-purple-500">
                    </div>
                    <div>
                        <label class="block mb-2 text-slate-300">Susunan Kolom Produk (Tampilan Komputer)</label>
                        <select id="cfg-kolom" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-purple-500">
                            <option value="grid-cols-2">2 Kolom (Besar)</option>
                            <option value="grid-cols-3">3 Kolom (Sedang)</option>
                            <option value="grid-cols-4">4 Kolom (Kecil/Padat)</option>
                        </select>
                    </div>
                    <button onclick="simpanConfig()" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-lg font-bold transition mt-4"><i class="fa-solid fa-floppy-disk"></i> Terapkan Tema ke Website</button>
                </div>
            </div>
        </section>

        <section id="section-ulasan" class="hidden">
            <div class="glass p-8 rounded-2xl border-t-4 border-t-amber-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-star"></i> Kelola Ulasan Produk</h2>
                    <button onclick="loadUlasan()" class="text-amber-400 hover:text-amber-300 text-sm"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                    <select id="filterProdukUlasan" onchange="renderUlasanAdmin()" class="bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-amber-500 text-white cursor-pointer">
                        <option value="">Semua Produk</option>
                    </select>
                    <select id="filterRatingUlasan" onchange="renderUlasanAdmin()" class="bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-amber-500 text-white cursor-pointer">
                        <option value="">Semua Rating</option>
                        <option value="5">5 Bintang</option>
                        <option value="4">4 Bintang</option>
                        <option value="3">3 Bintang</option>
                        <option value="2">2 Bintang</option>
                        <option value="1">1 Bintang</option>
                    </select>
                    <input type="text" id="cariUlasan" oninput="renderUlasanAdmin()" placeholder="Cari nama / isi ulasan..." class="bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-amber-500">
                </div>
                <div id="list-ulasan" class="space-y-3 max-h-[600px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #fbbf24 #1e293b;">
                    <p class="text-center text-slate-500">Memuat ulasan...</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        

        // !!! WAJIB ISI DENGAN URL APPS SCRIPT ANDA YANG TERBARU !!!
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbzB0UZRr5PDWnbY4gKkPSMlti17RKpaHx4zUYhdAaGOVt-8KZVu7pG5h0BWFIPrsjCs/exec";

        // GANTI ANGKA INI DENGAN TOKEN RAHASIA ANDA SENDIRI, lalu samakan di Apps Script
        const UPLOAD_TOKEN = "xiroro_upload_2026_ganti123";
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function checkLogin() {
            if (localStorage.getItem('xiroro_admin_logged_in') === 'true') {
                document.getElementById('areaLogin').style.display = 'none';
                document.getElementById('areaAdmin').style.display = 'block';
                loadProduk(); loadConfig();
                // Live polling: refresh pesanan di background setiap 30 detik
                if (!window._adminPollInterval) {
                    window._adminPollInterval = setInterval(async () => {
                        const tabAktif = document.querySelector('.tab-active');
                        const isPesananTab = tabAktif && document.getElementById('section-pesanan') && !document.getElementById('section-pesanan').classList.contains('hidden');
                        if (isPesananTab) {
                            try {
                                const res = await fetch(appsScriptUrl + "?action=bacaSemuaPesanan");
                                const dataArr = await res.json();
                                const baru = (dataArr || []).map(d => ({
                                    id: (d.fields && d.fields.kode) ? d.fields.kode.stringValue : "",
                                    data: {
                                        kode: (d.fields && d.fields.kode) ? d.fields.kode.stringValue : "",
                                        waktu: (d.fields && d.fields.waktu) ? d.fields.waktu.stringValue : "",
                                        namaProduk: (d.fields && d.fields.namaProduk) ? d.fields.namaProduk.stringValue : "",
                                        nominal: (d.fields && d.fields.nominal) ? d.fields.nominal.integerValue : 0,
                                        namaDana: (d.fields && d.fields.namaDana) ? d.fields.namaDana.stringValue : "",
                                        status: (d.fields && d.fields.status) ? d.fields.status.stringValue : "",
                                        noRef: (d.fields && d.fields.noRef) ? d.fields.noRef.stringValue : "",
                                        catatan: (d.fields && d.fields.catatan) ? d.fields.catatan.stringValue : "",
                                        fileLink: (d.fields && d.fields.fileLink) ? d.fields.fileLink.stringValue : "",
                                        tgChat: (d.fields && d.fields.tgChat) ? d.fields.tgChat.stringValue : "",
                                        tgMsgId: (d.fields && d.fields.tgMsgId) ? d.fields.tgMsgId.stringValue : ""
                                    }
                                }));
                                // Hanya render ulang jika ada perubahan data
                                const hashBaru = JSON.stringify(baru.map(o => o.id + o.data.status));
                                const hashLama = JSON.stringify(semuaPesanan.map(o => o.id + o.data.status));
                                if (hashBaru !== hashLama) {
                                    semuaPesanan = baru;
                                    isiBulan();
                                    renderPesananAdmin();
                                    grafikPesanan();
                                    renderStatistik();
                                }
                            } catch (e) {}
                        }
                    }, 30000);
                }
            } else {
                document.getElementById('areaLogin').style.display = 'block';
                document.getElementById('areaAdmin').style.display = 'none';
                if (window._adminPollInterval) { clearInterval(window._adminPollInterval); window._adminPollInterval = null; }
            }
        }
        
        checkLogin();

        async function loginAdmin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            Swal.fire({ title: 'Memeriksa...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            
            try {
                const body = new URLSearchParams({ action: 'adminLogin', email: email, password: password });
                const res = await fetch(appsScriptUrl, { method: 'POST', body: body });
                const json = await res.json();
                
                if (json.ok) {
                    localStorage.setItem('xiroro_admin_logged_in', 'true');
                    Swal.close(); 
                    Swal.fire({ icon: 'success', title: 'Selamat Datang!', timer: 1500, showConfirmButton: false });
                    checkLogin();
                } else {
                    Swal.fire({ icon: 'error', title: 'Gagal Login', text: json.error || "Email atau password salah" });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Gagal Login', text: error.message });
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('xiroro_admin_logged_in');
            document.getElementById('email').value = ''; 
            document.getElementById('password').value = '';
            checkLogin();
        }

        function switchTab(tab) {
            document.getElementById('section-produk').classList.toggle('hidden', tab !== 'produk');
            document.getElementById('section-pesanan').classList.toggle('hidden', tab !== 'pesanan');
            document.getElementById('section-ulasan').classList.toggle('hidden', tab !== 'ulasan');
            document.getElementById('section-tampilan').classList.toggle('hidden', tab !== 'tampilan');
            document.getElementById('btn-produk').className = tab === 'produk' ? 'pb-4 tab-active font-medium' : 'pb-4 text-slate-400 hover:text-white font-medium';
            document.getElementById('btn-pesanan').className = tab === 'pesanan' ? 'pb-4 tab-active font-medium' : 'pb-4 text-slate-400 hover:text-white font-medium';
            document.getElementById('btn-ulasan').className = tab === 'ulasan' ? 'pb-4 tab-active font-medium' : 'pb-4 text-slate-400 hover:text-white font-medium';
            document.getElementById('btn-tampilan').className = tab === 'tampilan' ? 'pb-4 tab-active font-medium' : 'pb-4 text-slate-400 hover:text-white font-medium';
            if (tab === 'pesanan') loadPesanan();
            if (tab === 'ulasan') loadUlasan();
        }

        let semuaPesanan = [];
        let arrTampil = [];
        let mapHarga = {};
        function badgeStatus(s) {
            const map = { MENUNGGU: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/40', TERVERIFIKASI: 'bg-blue-500/20 text-blue-300 border-blue-500/40', SELESAI: 'bg-green-500/20 text-green-400 border-green-500/40', DITOLAK: 'bg-red-500/20 text-red-400 border-red-500/40' };
            return `<span class="text-[10px] px-2 py-1 rounded-full border ${map[s] || 'bg-slate-700 text-slate-300 border-slate-600'}">${s}</span>`;
        }
        const fmt = num => Number(num).toLocaleString('id-ID');
        function escP(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        
        function grafikPesanan() {
            const canvas = document.getElementById('chartPesanan');
            if (!canvas || !window.Chart) return;
            const labels = [];
            const values = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const t = new Date(now.getFullYear(), now.getMonth() - i, 1);
                labels.push(t.toLocaleString('id-ID', { month: 'short', year: '2-digit' }));
                const pref = t.toISOString().slice(0, 7);
                const tot = semuaPesanan.filter(o => (o.data.status === 'TERVERIFIKASI' || o.data.status === 'SELESAI') && (o.data.waktu || '').slice(0, 7) === pref).reduce((s, o) => s + (parseInt(o.data.nominal) || 0), 0);
                values.push(tot);
            }
            if (window.chartObj) window.chartObj.destroy();
            window.chartObj = new Chart(canvas, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Pendapatan (Rp)', data: values, backgroundColor: 'rgba(34,197,94,0.6)', borderColor: '#22c55e', borderWidth: 1 }] },
                options: { plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
            });
        }

        
        function renderStatistik() {
            const el = document.getElementById('statAdmin');
            if (!el) return;
            if (!semuaPesanan.length) { el.innerHTML = ''; return; }
            const now = new Date();
            const mm = now.getFullYear() + '-' + (now.getMonth() + 1);
            const ter = o => o.data.status === 'TERVERIFIKASI' || o.data.status === 'SELESAI';
            const cur = semuaPesanan.filter(o => ter(o) && (o.data.waktu || '').slice(0, 7) === mm);
            const per = {};
            cur.forEach(o => {
                const n = o.data.namaProduk || '-';
                per[n] = (per[n] || 0) + (parseInt(o.data.nominal) || 0);
            });
            const top = Object.keys(per).sort((a, b) => per[b] - per[a]).slice(0, 5);

            const totalMinggu = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
                const pref = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
                totalMinggu.push(semuaPesanan.filter(o => {
                    if (!ter(o)) return false;
                    const w = o.data.waktu ? new Date(o.data.waktu) : null;
                    if (!w) return false;
                    return (w.getFullYear() + '-' + (w.getMonth() + 1) + '-' + w.getDate()) === pref;
                }).reduce((s, o) => s + (parseInt(o.data.nominal) || 0), 0));
            }
            const maxHari = Math.max.apply(null, totalMinggu.concat([1]));
            const namaHari = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

            el.innerHTML = `
                <div class="glass rounded-xl p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h3 class="text-sm font-bold text-green-400 mb-3"><i class="fa-solid fa-trophy mr-1"></i> Top 5 Produk (Bulan Ini)</h3>
                        ${top.length ? top.map((p, i) => `<div class="flex justify-between text-xs text-slate-300 border-b border-slate-700/50 pb-1 mb-1"><span class="truncate pr-2">${i + 1}. ${escP(p)}</span><span class="text-cyan-400 font-bold whitespace-nowrap">Rp ${(per[p] || 0).toLocaleString('id-ID')}</span></div>`).join('') : '<p class="text-xs text-slate-500">Belum ada penjualan bulan ini.</p>'}

                      (function () {
                          const orP = (semuaPesanan.find(o => o.id === id) || {}).data || {};

                      loadPesanan();
                  });

              if (statusBaru === 'MENUNGGU') {
                  promptNoRef();

                  const d = (semuaPesanan.find(o => o.id === id) || {}).data || {};
                  Swal.fire({ title: 'Selesaikan Pesanan?', text: 'File akan dikirim ke pembeli setelah ini.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#22c55e', background: '#1e293b' }).then(async res => {

                          const prodDitemukan = semuaProduk.find(p => (p.data.nama || '').toLowerCase() === (d.namaProduk || '').toLowerCase());
                          if (prodDitemukan) fl = prodDitemukan.data.fileLink || '';

                      if (fl) {

                                  <p class="text-[11px] text-slate-400 text-left mt-2">Status di halaman cek pembeli otomatis jadi SELESAI (live), file tampil di sana. Info ke pembeli: sudah dikirim file ${d.kode ? '- pantau https://xiroro-ab.github.io/Toko-Online-Script-Mlbb/cek.html?kode=' + d.kode : ''}.</p>`,
                              background: '#1e293b'
                          });
                      } else {
                          Swal.fire({ icon: 'warning', title: 'Tidak Ada Link File', text: 'Pesanan ini tidak menyimpan link file. Periksa link di katalog produk.', background: '#1e293b' });

                  Swal.fire({ title: 'Tolak Pesanan?', text: 'Pastikan pembayaran tidak masuk sebelum menolak.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', background: '#1e293b' }).then(async res => {

                          const body = new URLSearchParams({ action: 'adminTolakPesanan', pesananId: id });
                          await fetch(appsScriptUrl, { method: 'POST', body: body });
                          loadPesanan(); 
                      }
                  });
              }
          }

        function isiBulan() {
            const sel = document.getElementById('bulanPesanan');
            const cur = sel.value;
            const bulanSet = new Set();
            semuaPesanan.forEach(o => { const b = (o.data.waktu || '').slice(0, 7); if (b) bulanSet.add(b); });
            let opt = '<option value="">Semua Bulan</option>';
            [...bulanSet].sort().reverse().forEach(b => {
                const [y, m] = b.split('-');
                const nama = new Date(y, m - 1, 1).toLocaleString('id-ID', { month: 'long', year: 'numeric' });
                const jml = semuaPesanan.filter(o => (o.data.waktu || '').slice(0, 7) === b).length;
                opt += `<option value="${b}">${nama} (${jml})</option>`;
            });
            sel.innerHTML = opt;
            sel.value = cur;
        }

        function exportPesananPDF() {
            if (!window.jspdf) { Swal.fire({ icon: 'error', title: 'Gagal Export', text: 'jsPDF tidak termuat. Periksa koneksi internet.', background: '#1e293b' }); return; }
            if (!arrTampil || !arrTampil.length) { Swal.fire({ icon: 'info', title: 'Tidak Ada Data', text: 'Tidak ada pesanan pada tampilan yang dipilih.', background: '#1e293b' }); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            const bln = document.getElementById('bulanPesanan').value;
            const label = bln ? new Date(bln.slice(0, 4), parseInt(bln.slice(5, 7)) - 1, 1).toLocaleString('id-ID', { month: 'long', year: 'numeric' }) : 'Semua Bulan';
            doc.setFontSize(16);
            doc.text('Log Pesanan Xiroro', 14, 14);
            doc.setFontSize(9);
            doc.setTextColor(120);
            doc.text('Periode: ' + label + '  |  Diexport: ' + new Date().toLocaleString('id-ID'), 14, 20);
            const body = arrTampil.map(o => {
                const d = o.data;
                return [d.kode || '', d.namaProduk || '', 'Rp ' + ((d.nominal || 0).toLocaleString('id-ID')), d.namaDana || '', d.status || '', d.noRef || '', d.waktu ? new Date(d.waktu).toLocaleString('id-ID') : ''];
            });
            doc.autoTable({ head: [['Kode', 'Produk', 'Nominal', 'Nama DANA', 'Status', 'No. Ref', 'Waktu']], body: body, startY: 24, styles: { fontSize: 7 }, headStyles: { fillColor: [6, 182, 212] } });
            doc.save('log-pesanan-' + (bln || 'all') + '.pdf');
        }

            const [y, m] = bln.split('-');

        async function salinLinkCerdas(id) {
            // MENGGUNAKAN LINK ABSOLUT: Pastikan link selalu mengarah ke halaman depan
            let baseUrl = "https://xiroro-ab.github.io/Toko-Online-Script-Mlbb/";
            
            // Ambil harga & nama langsung dari semuaProduk
            let hargaNum = 0, namaScript = "Script";
            try {
                const p = semuaProduk.find(x => x.id === id);
                if (p) {
                    hargaNum = parseInt(p.data.harga) || 0;
                    namaScript = p.data.namaProduk || p.data.nama || "Script";
                }
            } catch (e) { }

            // Konversi harga ke angka, deteksi jika Gratis (<= 0)
            let linkTujuan = (hargaNum <= 0) 
                ? baseUrl + "gratis.html?id=" + id 
                : baseUrl + "?id=" + id;

            if (navigator.clipboard && window.isSecureContext) {
                // Proses salin otomatis untuk browser yang mendukung
                navigator.clipboard.writeText(linkTujuan).then(() => {
                    Swal.fire({ 
                        icon: 'success', 
                        title: 'Link Siap Dibagikan!', 
                        html: `<b>${namaScript}</b><br><br><code class="text-cyan-400 text-xs break-all">${linkTujuan}</code><br><br><span class="text-xs text-slate-400">(Sistem otomatis memilih jalur ${hargaNum <= 0 ? 'Gratis' : 'Premium'})</span>`, 
                        background: '#1e293b', 
                        color: '#fff' 
                    });
                }).catch(err => {
                    // Jika diblokir oleh laptop/browser, munculkan popup salin manual
                    Swal.fire({ icon: 'info', title: 'Salin Manual', text: 'Browser memblokir salin otomatis. Silakan salin link di bawah ini:', input: 'text', inputValue: linkTujuan, background: '#1e293b', color: '#fff' });
                });
            } else {
                 // Fallback darurat jika fitur clipboard tidak tersedia sama sekali
                 Swal.fire({ icon: 'info', title: 'Salin Manual', text: 'Silakan salin link di bawah ini:', input: 'text', inputValue: linkTujuan, background: '#1e293b', color: '#fff' });
            }
        }

            let docsArray = semuaProduk.filter(item => (item.data.nama || '').toLowerCase().includes(query));

            if (docsArray.length === 0) { list.innerHTML = "<p class='text-center text-slate-500'>Tidak ada produk yang cocok dengan pencarian.</p>"; return; }
            docsArray.forEach(item => {
                    const data = item.data;
                    const id = item.id;
                    let imgUrl = data.gambarUrl || "https://dummyimage.com/150x150/1e293b/22d3ee.png&text=Tanpa+Foto";
                    if (imgUrl.includes("GAGAL_UPLOAD")) imgUrl = "https://dummyimage.com/150x150/1e293b/ef4444.png&text=Error";
                    else if (imgUrl.includes("drive.google.com")) {
                        let fileId = "";
                        if (imgUrl.includes("/d/")) fileId = imgUrl.split("/d/")[1].split("/")[0];
                        else if (imgUrl.includes("id=")) fileId = imgUrl.split("id=")[1].split("&")[0];
                        if (fileId) imgUrl = "https://lh3.googleusercontent.com/d/" + fileId;
                    }

                    list.innerHTML += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-800/80 rounded-xl border border-slate-700 hover:border-cyan-500/50 transition gap-4">
                            
                            <div class="flex items-start sm:items-center gap-4 w-full overflow-hidden">
                                <div class="w-16 h-16 sm:w-14 sm:h-14 bg-slate-900 rounded-lg overflow-hidden border border-slate-600 flex-shrink-0">
                                    <img src="${esc(imgUrl)}" class="w-full h-full object-cover">
                                </div>
                                <div class="overflow-hidden w-full">
                                    <h4 class="font-bold text-white max-h-[3.2rem] overflow-y-auto desc-scroll leading-tight pr-1 mb-1">${esc(data.nama)}</h4>
                                    <p class="text-xs text-cyan-400 font-mono mb-2">Rp ${(parseInt(data.harga) || 0).toLocaleString('id-ID')}</p>
                                    <div class="flex flex-wrap gap-2">
                                        <span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300"><i class="fa-solid fa-fire text-orange-400 mr-1"></i> Terjual ${data.terjual || 0}</span>
                                        <span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300"><i class="fa-solid fa-eye text-cyan-400 mr-1"></i> Dilihat ${data.views || 0}x</span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex gap-2 w-full sm:w-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-700/50 mt-1 sm:mt-0 flex-shrink-0">
                                <button onclick="salinLinkCerdas('${id}')" class="flex-1 sm:flex-none w-auto sm:w-10 h-10 bg-blue-600/80 rounded-lg hover:bg-blue-500 transition text-white flex items-center justify-center" title="Salin Link Bagikan"><i class="fa-solid fa-share-nodes"></i></button>
                                
                                <button onclick="prepareEdit('${id}')" class="flex-1 sm:flex-none w-auto sm:w-10 h-10 bg-yellow-600/80 rounded-lg hover:bg-yellow-500 transition text-white flex items-center justify-center" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="hapusProduk('${id}')" class="flex-1 sm:flex-none w-auto sm:w-10 h-10 bg-red-600/80 rounded-lg hover:bg-red-500 transition text-white flex items-center justify-center" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                            </div>

                        </div>
                    `;
                });
        }

        async function simpanProduk(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanProduk');
            const orig = btn.innerHTML;
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Menyimpan...";
            btn.disabled = true;

            const editId = document.getElementById('pId').value;
            const action = editId ? 'adminEditProduk' : 'adminTambahProduk';

            let imageUrl = document.getElementById('pGambar').value;
            const fileInput = document.getElementById('pFileGambar');
            
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    const base64Data = await new Promise((resolve) => {
                        reader.onload = () => resolve(reader.result.split(",")[1]);
                        reader.readAsDataURL(file);
                    });
                    const response = await fetch(appsScriptUrl, { method: "POST", body: new URLSearchParams({ action: "upload", filename: file.name, mimetype: file.type, data: base64Data }) });
                    imageUrl = await response.text(); 
                    if (imageUrl.includes("GAGAL_UPLOAD")) {
                        throw new Error("Gagal upload gambar");
                    }
                }

                const dataToSave = new URLSearchParams({
                    action: action,
                    produkId: editId,
                    namaProduk: document.getElementById('pNama').value,
                    harga: document.getElementById('pHarga').value,
                    kategori: document.getElementById('pKategori').value,
                    kode: document.getElementById('pKode').value,
                    status: document.getElementById('pStatus').value,
                    gambarUrl: imageUrl
                });

                const res = await fetch(appsScriptUrl, { method: 'POST', body: dataToSave });
                const json = await res.json();
                if (!json.ok) throw new Error(json.error);
                
                Swal.fire('Berhasil!', 'Data produk tersimpan.', 'success');
                tutupModalProduk();
                loadProduk();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        async function prepareEdit(id) {
            document.getElementById('form-title').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> Edit Produk";
            try {
                const prod = semuaProduk.find(p => p.id === id);
                if (!prod) { Swal.fire('Error', 'Data produk tidak ditemukan.', 'error'); return; }
                const data = prod.data;
                document.getElementById('edit-id').value = id;
                document.getElementById('gambarUrlLama').value = data.gambarUrl || '';
                document.getElementById('nama').value = data.nama || '';
                document.getElementById('harga').value = data.harga || '';
                document.getElementById('deskripsi').value = data.deskripsi || '';
                document.getElementById('videoID').value = data.videoID || '';
                document.getElementById('fileLink').value = data.fileLink || '';
                document.getElementById('foto').value = '';
                document.getElementById('info-foto').classList.remove('hidden'); 

                const btn = document.getElementById('btn-submit'); btn.innerHTML = "<i class='fa-solid fa-check'></i> Update Produk";
                btn.classList.replace('bg-cyan-600', 'bg-yellow-600'); btn.classList.replace('hover:bg-cyan-500', 'hover:bg-yellow-500');
                document.getElementById('btn-cancel').classList.remove('hidden');
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        }

        function resetForm() {
            document.getElementById('form-produk').reset(); document.getElementById('edit-id').value = ""; document.getElementById('gambarUrlLama').value = "";
            document.getElementById('form-title').innerHTML = "<i class='fa-solid fa-plus'></i> Tambah Produk Baru"; document.getElementById('info-foto').classList.add('hidden');
            const btn = document.getElementById('btn-submit'); btn.disabled = false; btn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> Simpan ke Etalase";
            btn.classList.replace('bg-yellow-600', 'bg-cyan-600'); btn.classList.replace('hover:bg-yellow-500', 'hover:bg-cyan-500');
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        async function hapusProduk(id) {
            Swal.fire({ title: 'Hapus Produk?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Hapus' }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Menghapus...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        const res = await fetch(appsScriptUrl, { method: 'POST', body: new URLSearchParams({ action: 'adminHapusProduk', produkId: id }) });
                        const json = await res.json();
                        if (json.ok) { Swal.fire('Terhapus!', 'Produk dihapus.', 'success'); loadProduk(); publishEtalase(); }
                        else { Swal.fire('Gagal', json.error, 'error'); }
                    } catch (e) { Swal.fire('Error', e.message, 'error'); }
                }
            });
        }

        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('xiroro_config')) || { video: "", logo: "", kolom: "grid-cols-4" };
            document.getElementById('cfg-video').value = config.video; document.getElementById('cfg-logo').value = config.logo; document.getElementById('cfg-kolom').value = config.kolom;
        }

        async function simpanConfig() {
            const cfg = { video: document.getElementById('cfg-video').value, logo: document.getElementById('cfg-logo').value, kolom: document.getElementById('cfg-kolom').value };
            localStorage.setItem('xiroro_config', JSON.stringify(cfg));
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            try {
                const res = await fetch(appsScriptUrl, { method: 'POST', body: new URLSearchParams({ action: 'adminSimpanConfig', configData: JSON.stringify(cfg) }) });
                const json = await res.json();
                if (json.ok) Swal.fire('Tersimpan!', 'Tema tersimpan ke server. Semua pembeli akan otomatis melihatnya.', 'success');
                else throw new Error(json.error);
            } catch (err) {
                Swal.fire('Tersimpan Lokal', 'Gagal simpan ke server: ' + err.message + '. Tema hanya berlaku di browser ini.', 'warning');
            }
        }

        // ============ ULASAN MANAGEMENT ============
        let semuaUlasan = [];
        let mapProdukNama = {};

        async function loadUlasan() {
            const list = document.getElementById('list-ulasan');
            try {
                list.innerHTML = `<p class='text-cyan-400 font-bold'><i class='fa-solid fa-spinner fa-spin'></i> Memuat ulasan...</p>`;
                
                const [resU, resP] = await Promise.all([
                    fetch(appsScriptUrl + "?action=bacaSemuaUlasan").then(r => r.json()),
                    fetch(appsScriptUrl + "?action=bacaSemuaProduk").then(r => r.json())
                ]);
                
                mapProdukNama = {};
                resP.forEach(doc => { mapProdukNama[doc.id] = doc.data.namaProduk; });

                list.innerHTML = "";
                if(!resU || resU.length === 0) { list.innerHTML = "<p class='text-center text-slate-500'>Belum ada ulasan.</p>"; return; }
                
                resU.forEach(doc => {
                    const data = doc;
                    const nmPr = mapProdukNama[data.produkId] || "Produk Dihapus";
                    let star = "";
                    for(let i=1; i<=5; i++) {
                        if(i <= data.rating) star += `<i class="fa-solid fa-star text-yellow-500"></i>`;
                        else star += `<i class="fa-regular fa-star text-slate-600"></i>`;
                    }
                    list.innerHTML += 
                        `<div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-lg relative">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="font-bold text-white text-sm">${escP(data.nama)}</h4>
                                    <p class="text-[10px] text-cyan-400">${escP(nmPr)}</p>
                                </div>
                                <div class="text-xs">${star}</div>
                            </div>
                            <p class="text-slate-300 text-xs italic">"${escP(data.teks)}"</p>
                            <p class="text-[9px] text-slate-500 mt-2 text-right">${new Date(data.waktu).toLocaleString('id-ID')}</p>
                            <div class="mt-3 flex gap-2">
                                <button onclick="editUlasan('${doc.id}', '${escP(data.nama)}', ${data.rating}, '${escP(data.teks)}')" class="text-xs bg-amber-600/80 hover:bg-amber-500 text-white px-3 py-1.5 rounded transition">Edit</button>
                                <button onclick="borUlasan('${doc.id}')" class="text-xs bg-slate-700 hover:bg-red-600 text-white px-3 py-1.5 rounded transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            } catch (e) {
                list.innerHTML = `<p class='text-red-500'>Error: ${e.message}</p>`;
            }
        }

        function isiFilterProduk() {
            const sel = document.getElementById('filterProdukUlasan');
            const cur = sel.value;
            const produkIds = [...new Set(semuaUlasan.map(u => u.data.produkId).filter(Boolean))];
            let opt = '<option value="">Semua Produk</option>';
            produkIds.forEach(pid => {
                const nama = mapProdukNama[pid] || pid;
                opt += `<option value="${esc(pid)}">${esc(nama)}</option>`;
            });
            sel.innerHTML = opt;
            sel.value = cur;
        }

        function bintangRating(r) {
            let s = '';
            for (let i = 1; i <= 5; i++) {
                s += `<i class="${i <= r ? 'fa-solid text-amber-400' : 'fa-regular text-slate-500'} fa-star"></i>`;
            }
            return s;
        }

        function renderUlasanAdmin() {
            const list = document.getElementById('list-ulasan');
            const q = document.getElementById('cariUlasan') ? document.getElementById('cariUlasan').value.toLowerCase() : '';
            const filterProduk = document.getElementById('filterProdukUlasan') ? document.getElementById('filterProdukUlasan').value : '';
            const filterRating = document.getElementById('filterRatingUlasan') ? document.getElementById('filterRatingUlasan').value : '';

            const filtered = semuaUlasan.filter(u => {
                const d = u.data;
                const cocokCari = (d.nama || '').toLowerCase().includes(q) || (d.teks || '').toLowerCase().includes(q);
                const cocokProduk = !filterProduk || d.produkId === filterProduk;
                const cocokRating = !filterRating || String(d.rating) === filterRating;
                return cocokCari && cocokProduk && cocokRating;
            });

            if (!filtered.length) {
                list.innerHTML = "<p class='text-center text-slate-500'>Tidak ada ulasan yang cocok.</p>";
                return;
            }

            let html = '';
            filtered.forEach(u => {
                const d = u.data;
                const produkNama = mapProdukNama[d.produkId] || d.produkId || '-';
                const waktu = d.waktu ? new Date(d.waktu).toLocaleString('id-ID') : '-';
                html += `
                    <div class="p-4 bg-slate-800/80 rounded-xl border border-slate-700 hover:border-amber-500/40 transition">
                        <div class="flex flex-wrap justify-between items-start gap-2 mb-2">
                            <div>
                                <span class="font-mono text-xs bg-slate-900 px-2 py-1 rounded border border-slate-700 text-amber-400">${esc(u.id.slice(0, 12))}...</span>
                                <h4 class="font-bold text-white mt-2">${esc(produkNama)}</h4>
                            </div>
                            <span class="text-amber-400 text-lg">${bintangRating(d.rating || 0)}</span>
                        </div>
                        <div class="text-xs text-slate-400 space-y-1 mb-3">
                            <p><i class="fa-solid fa-user text-cyan-400 mr-1"></i> <b class="text-white">${esc(d.nama || 'Anonim')}</b></p>
                            <p><i class="fa-solid fa-clock text-purple-400 mr-1"></i> ${waktu}</p>
                        </div>
                        <p class="text-slate-300 text-sm mb-3 italic">"${esc(d.teks || '')}"</p>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="editUlasan('${u.id}')" class="text-[11px] px-3 py-1.5 rounded-lg bg-amber-600/80 hover:bg-amber-500 transition text-white"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                            <button onclick="hapusUlasan('${u.id}','${esc(u.id.slice(0, 12))}')" class="text-[11px] px-3 py-1.5 rounded-lg bg-red-600/80 hover:bg-red-500 transition text-white ml-auto"><i class="fa-solid fa-trash mr-1"></i> Hapus</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function editUlasan(id) {
            const u = semuaUlasan.find(x => x.id === id);
            if (!u) return;
            const d = u.data;
            Swal.fire({
                title: 'Edit Ulasan',
                html: `
                    <div class="text-left space-y-3">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Nama</label>
                            <input id="edit-nama" value="${esc(d.nama || '')}" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white focus:outline-amber-500">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Rating (1-5)</label>
                            <select id="edit-rating" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white focus:outline-amber-500">
                                <option value="5" ${d.rating === 5 ? 'selected' : ''}>5 - Luar Biasa</option>
                                <option value="4" ${d.rating === 4 ? 'selected' : ''}>4 - Bagus</option>
                                <option value="3" ${d.rating === 3 ? 'selected' : ''}>3 - Cukup</option>
                                <option value="2" ${d.rating === 2 ? 'selected' : ''}>2 - Kurang</option>
                                <option value="1" ${d.rating === 1 ? 'selected' : ''}>1 - Buruk</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Isi Ulasan</label>
                            <textarea id="edit-teks" rows="3" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white focus:outline-amber-500">${esc(d.teks || '')}</textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Simpan Perubahan',
                confirmButtonColor: '#f59e0b',
                cancelButtonText: 'Batal',
                background: '#1e293b',
                color: '#fff'
            }).then(async res => {
                if (!res.isConfirmed) return;
                const nama = document.getElementById('edit-nama').value.trim();
                const rating = parseInt(document.getElementById('edit-rating').value, 10);
                const teks = document.getElementById('edit-teks').value.trim();
                if (!nama || !teks) { Swal.fire('Error', 'Nama dan isi ulasan wajib diisi.', 'error'); return; }
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: new URLSearchParams({ action: 'adminEditUlasan', ulasanId: id, nama: nama, rating: rating, teks: teks }) });
                    const json = await res.json();
                    if (!json.ok) throw new Error(json.error);
                    Swal.fire('Tersimpan!', 'Ulasan diperbarui.', 'success');
                    loadUlasan();
                } catch (e) { Swal.fire('Gagal', e.message, 'error'); }
            });
        }

        function hapusUlasan(id, label) {
            Swal.fire({
                title: 'Hapus Ulasan?',
                text: `Ulasan ${label}... akan dihapus permanen.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Hapus',
                confirmButtonColor: '#ef4444',
                cancelButtonText: 'Batal',
                background: '#1e293b',
                color: '#fff'
            }).then(async res => {
                if (!res.isConfirmed) return;
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: new URLSearchParams({ action: 'adminHapusUlasan', ulasanId: id }) });
                    const json = await res.json();
                    if (!json.ok) throw new Error(json.error);
                    Swal.fire('Terhapus!', 'Ulasan dihapus.', 'success');
                    loadUlasan();
                } catch (e) { Swal.fire('Gagal', e.message, 'error'); }
            });
        }
    </script>
</body>
</html>
