<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiroro Script | Premium Mods</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .glass-panel { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); }
        .card { border: 1px solid rgba(6,182,212,0.3); border-radius: 10px; padding: 20px; transition: 0.2s; }
        .card:hover { border-color: rgba(6,182,212,0.8); }
        .desc-scroll::-webkit-scrollbar { width: 4px; }
        .desc-scroll::-webkit-scrollbar-thumb { background: #22d3ee; border-radius: 10px; }
        .xiroro-slider::-webkit-scrollbar { height: 6px; }
        .xiroro-slider::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
    </style>
</head>
<body class="text-white">
    <header class="py-10 text-center glass-panel border-b border-cyan-500/30">
        <h1 class="text-4xl font-bold"><i class="fa-solid fa-code text-cyan-400"></i> Xiroro <span class="text-cyan-400">Script</span></h1>
    </header>

    <main class="container mx-auto px-6 py-10">
        <div id="katalog-produk" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
             <p class="text-center col-span-full">MEMUAT DATABASE...</p>
        </div>
    </main>

    <script>
        const firebaseConfig = { projectId: "toko-mod-mlbb" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const PRODUK_URL = "https://xiroro-ab.github.io/Toko-Online-Script-Mlbb/produk.json?v=" + Date.now();

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        
        async function muatSemuaRating() {
            const r = await fetch(`https://firestore.googleapis.com/v1/projects/toko-mod-mlbb/databases/(default)/documents/ulasan?pageSize=1000`);
            const j = await r.json();
            const ratings = {};
            (j.documents || []).forEach(d => {
                const f = d.fields || {};
                const pid = (f.produkId && f.produkId.stringValue) || '';
                const rate = parseInt((f.rating && f.rating.integerValue) || 0, 10);
                if (pid) {
                    if (!ratings[pid]) ratings[pid] = [];
                    ratings[pid].push(rate);
                }
            });
            document.querySelectorAll('.rating-val').forEach(el => {
                const pid = el.dataset.pid;
                el.innerText = ratings[pid] ? (ratings[pid].reduce((s, x) => s + x, 0) / ratings[pid].length).toFixed(1) : '5.0';
            });
        }

        function cetakKartu(doc) {
            const f = doc.fields;
            const id = doc.name.split('/').pop();
            return `
                <div class="card glass-panel flex flex-col cursor-pointer" onclick="location.href='?id=${id}'">
                    <img src="${esc(f.gambarUrl.stringValue)}" class="w-full h-40 object-cover rounded-lg mb-4">
                    <h3 class="font-bold">${esc(f.nama.stringValue)}</h3>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-cyan-400 font-bold">Rp ${parseInt(f.harga.stringValue).toLocaleString()}</span>
                        <span class="text-yellow-400 text-xs"><i class="fa-solid fa-star"></i> <span class="rating-val" data-pid="${id}">...</span></span>
                    </div>
                </div>
            `;
        }

        fetch(PRODUK_URL).then(res => res.json()).then(items => {
            const container = document.getElementById('katalog-produk');
            const targetId = new URLSearchParams(window.location.search).get('id');
            window.dataToko = items.map(it => ({ name: "script/" + it.id, fields: {
                nama: { stringValue: it.data.nama },
                harga: { stringValue: it.data.harga },
                gambarUrl: { stringValue: it.data.gambarUrl }
            }}));

            if (targetId) {
                const item = window.dataToko.find(d => d.name.split('/').pop() === targetId);
                container.innerHTML = `
                    <div class="col-span-full flex flex-col lg:flex-row gap-10">
                        <div class="flex-1 card glass-panel">
                            <img src="${item.fields.gambarUrl.stringValue}" class="w-full rounded-lg mb-4">
                            <h1 class="text-3xl font-bold">${item.fields.nama.stringValue}</h1>
                            <p class="text-2xl text-cyan-400 font-bold my-4">Rp ${parseInt(item.fields.harga.stringValue).toLocaleString()}</p>
                            <a href="index.html" class="bg-slate-700 px-6 py-2 rounded-lg">Kembali</a>
                        </div>
                        <div class="w-full lg:w-80 glass-panel p-6 rounded-lg" id="area-ulasan">
                            <h3 class="font-bold mb-4">Ulasan Pembeli</h3>
                            <div id="list-ulasan"></div>
                        </div>
                    </div>
                `;
                muatUlasanDetail(targetId);
            } else {
                container.innerHTML = window.dataToko.map(doc => cetakKartu(doc)).join('');
            }
            muatSemuaRating();
        });

        async function muatUlasanDetail(pid) {
            const r = await fetch(`https://firestore.googleapis.com/v1/projects/toko-mod-mlbb/databases/(default)/documents/ulasan?pageSize=500`);
            const j = await r.json();
            const arr = (j.documents || []).map(d => ({
                nama: d.fields.nama.stringValue,
                rating: parseInt(d.fields.rating.integerValue),
                teks: d.fields.teks.stringValue
            })).filter(x => x.produkId === pid); // Sesuaikan logika filter
            document.getElementById('list-ulasan').innerHTML = arr.map(x => `
                <div class="mb-3 border-b border-slate-700 pb-2 text-sm">
                    <p class="font-bold text-cyan-400">${x.nama}</p>
                    <p>${x.teks}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
